[package]
name              = "tempr_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description       = "GPUI components, views and layout for Tempr (11-gpui.md)"

[dependencies]
tempr_domain.workspace   = true
tempr_events.workspace   = true
tempr_services.workspace = true
tempr_editor.workspace   = true
tempr_intel.workspace    = true

# GPUI — only this crate (and the binary via `tempr_ui::gpui_compat`) touches these.
gpui.workspace          = true
gpui_platform.workspace = true
gpui_tokio.workspace    = true

anyhow.workspace               = true
futures.workspace              = true
tokio.workspace                = true
tracing.workspace              = true
unicode-segmentation.workspace = true

[dev-dependencies]
# `test-support` supplies `#[gpui::test]`, `TestAppContext` and the simulated
# platform (input injection, 1920x1080 test display). Cargo unifies features
# per package, so this also applies to `cargo bench` for this crate — benches
# that must stay free of test-support belong in their own crate (docs/TODO.md).
gpui = { workspace = true, features = ["test-support"] }
# Snapshot fixtures for the schema-aware view tests.
chrono.workspace = true
# A minimal in-test driver so `MainWindow` can connect and stream rows without
# a database (no test-support driver ships in production).
tempr_db.workspace    = true
async-trait.workspace = true

[lints]
workspace = true
