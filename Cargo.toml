[workspace]
members = [
    "crates/tempr",
    "crates/tempr_domain",
    "crates/tempr_events",
    "crates/tempr_services",
    "crates/tempr_workspace",
    "crates/tempr_db",
    "crates/tempr_db_postgres",
    "crates/tempr_ui",
    "crates/tempr_editor",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
tempr_domain      = { path = "crates/tempr_domain" }
tempr_events      = { path = "crates/tempr_events" }
tempr_services    = { path = "crates/tempr_services" }
tempr_workspace   = { path = "crates/tempr_workspace" }
tempr_db          = { path = "crates/tempr_db" }
tempr_db_postgres = { path = "crates/tempr_db_postgres" }
tempr_ui          = { path = "crates/tempr_ui" }
tempr_editor      = { path = "crates/tempr_editor" }

# UI — GPUI from the Zed repo. `gpui` + `gpui_platform` + `gpui_tokio` MUST share one rev (D14/D16).
# Rev = main @ 2026-09-03 (first rev after the zlog/ztracing Apache-2.0 relicense, ac5af8b9, 2026-09-01). Apache-2.0 crates only — never `ui`/`theme`/`editor`/`markdown` (GPL).
gpui          = { git = "https://github.com/zed-industries/zed", rev = "ed8d6004648e4e38a6879d9c80ac4406ad3d7266" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ed8d6004648e4e38a6879d9c80ac4406ad3d7266", features = ["wayland", "x11"] }
gpui_tokio    = { git = "https://github.com/zed-industries/zed", rev = "ed8d6004648e4e38a6879d9c80ac4406ad3d7266" }

# Async
async-trait = "0.1"
futures      = "0.3"
tokio            = { version = "1", features = ["full"] }
tokio-postgres   = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool          = { version = "0.12", default-features = false, features = ["managed", "rt_tokio_1"] }
postgres-types   = "0.2"
# TLS for PostgreSQL: rustls (pure Rust, ring provider) + platform root store (D20)
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls                = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs   = "0.8"
rust_decimal     = { version = "1", features = ["db-postgres"] }
bytes            = "1"

# Editor (D21)
# LF / CRLF line semantics only (no unicode_lines / cr_lines): see tempr_editor::buffer
ropey = { version = "1", default-features = false, features = ["simd"] }
# tree-sitter runtime pinned to the grammar's own dev-dependency line (grammar ABI 14) — D22
tree-sitter        = "0.25"
tree-sitter-sequel = "0.3"

# Data / serialisation
chrono      = { version = "0.4", features = ["serde"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
uuid        = { version = "1", features = ["v4", "serde"] }

# Error handling
anyhow    = "1"
thiserror = "2"

# Platform directories
dirs = "5"

parking_lot = "0.12"
unicode-segmentation = "1"
url = "2"
percent-encoding = "2"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
tempfile = "3"

[workspace.lints.rust]
unsafe_code   = "forbid"
unused_must_use = "warn"

[workspace.lints.clippy]
unwrap_used  = "warn"
expect_used  = "warn"
